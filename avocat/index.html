<style>
:root{

  --grad:linear-gradient(120deg,var(--blue),var(--violet));
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;

header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 26px}

.lang{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.lang button{border:0;background:none;color:var(--muted);font:500 13px 'JetBrains Mono',monospace;padding:7px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--grad);color:#fff}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 28px}
.progress i{display:block;height:100%;width:0;background:var(--grad);transition:width .35s ease}
h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
h2{font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.lead{color:var(--soft);font-size:17px}
.sub{color:var(--muted);margin-bottom:26px}
.step{display:none;animation:fade .3s ease}
.step.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.q{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.q>label,.q>.ql{display:block;font-weight:600;font-size:16px;margin-bottom:4px}
.q .hint{color:var(--muted);font-size:14px;margin-bottom:12px}
.q>label+input,.q>label+textarea{margin-top:8px}
.req{color:#8FA6FF}
input[type=text],input[type=tel],input[type=email],input[type=url],textarea{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:14px;font:inherit;font-size:16px;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:#6C7FD0}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--soft);border-radius:999px;padding:10px 15px;font:inherit;font-size:15px;cursor:pointer;
  transition:all .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(80,60,170,.35)}
.reveal{margin-top:12px;display:none}
.reveal.on{display:block}
.soc{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.soc .row .chip{width:100%;text-align:start;border-radius:12px}
.soc .row input{margin-top:8px;display:none}
.soc .row.on input{display:block}
.file{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px dashed #3A3A42;border-radius:12px;padding:14px;margin-top:10px;cursor:pointer}
.file input{display:none}
.file b{font-weight:500}
.file span{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:20px;line-height:1}
.err{color:#FF8A8A;font-size:14px;margin-top:8px;display:none}
.err.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,rgba(10,10,11,0));z-index:5}
nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:16px;font:600 16px Inter,Heebo,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn.p{background:var(--grad);color:#fff;box-shadow:0 10px 26px rgba(80,60,170,.4)}
.btn.s{background:var(--surface);color:var(--soft);flex:0 0 auto;padding:16px 20px}
.btn:disabled{opacity:.6}
.intro-list{list-style:none;margin:24px 0 0;display:grid;gap:10px}
.intro-list li{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.3);color:var(--soft)}
.intro-list li b{color:#fff;font-weight:600}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:40px}
footer a{color:var(--soft)}

let lang = "fr", cur = 0;
const state = {};           // key -> Set of option index (multi/single)
const stepsEl = document.getElementById("steps");
const L = v => typeof v === "string" ? v : v[lang];
const FR = v => typeof v === "string" ? v : v.fr;

function build(){
  stepsEl.innerHTML = "";
  STEPS.forEach((s,i)=>{
    const d = document.createElement("section");
    d.className = "step"+(i===cur?" on":"");
    if(s.intro){
      d.innerHTML = `<p class="mono">Serial Kolors</p><div style="height:14px"></div><h1>${L(s.title)}</h1><p class="lead">${L(s.lead)}</p>
        <ul class="intro-list">${s.bullets.map(b=>`<li>${L(b)}</li>`).join("")}</ul>`;
    } else {
      d.innerHTML = `<p class="mono">${T[lang].step} ${i} ${T[lang].of} ${STEPS.length-1}</p><div class="progress"><i style="width:${i/(STEPS.length-1)*100}%"></i></div>
        <h2>${L(s.title)}</h2><p class="sub">${L(s.sub)}</p>`;
      s.q.forEach(q=>d.appendChild(question(q)));
      d.insertAdjacentHTML("beforeend",`<p class="err" data-err>${T[lang].required}</p>`);
    }
    stepsEl.appendChild(d);
  });
  nav();
}

function question(q){
  const box = document.createElement("div"); box.className="q";
  const lab = q.l && L(q.l) ? `<label for="in-${slug(q.k)}">${L(q.l)}${q.req?' <span class="req">*</span>':''}</label>` : "";
  const hint = q.hint ? `<p class="hint">${L(q.hint)}</p>` : (q.t==="multi"&&q.l&&L(q.l) ? `<p class="hint">${T[lang].multi}</p>`:"");
  if(["text","tel","email"].includes(q.t)){
    box.innerHTML = lab+hint;
    const inp = keepInput(q.k,"input"); inp.type=q.t; inp.id="in-"+slug(q.k); if(q.ac) inp.autocomplete=q.ac;
    if(q.t==="tel"){ inp.inputMode="tel"; inp.dir="ltr"; } if(q.t==="email") inp.dir="ltr"; if(q.req) inp.dataset.req=1;
    box.appendChild(inp);
  } else if(q.t==="textarea"){
    box.innerHTML = lab+hint;
    const ta = keepInput(q.k,"textarea"); ta.id="in-"+slug(q.k); box.appendChild(ta);
  } else if(q.t==="multi"||q.t==="single"){
    box.innerHTML = (lab?`<span class="ql">${L(q.l)}</span>`:"")+hint;
    if(!state[q.k]) state[q.k]=new Set(q.pre||[]);
    const wrap = document.createElement("div"); wrap.className="chips";
    q.opts.forEach((op,idx)=>{
      const c=document.createElement("button"); c.type="button"; c.className="chip"+(state[q.k].has(idx)?" on":""); c.textContent=L(op);
      c.onclick=()=>{
        const st=state[q.k];
        if(q.t==="single"){ const had=st.has(idx); st.clear(); if(!had) st.add(idx); [...wrap.children].forEach((x,j)=>x.classList.toggle("on",st.has(j))); }
        else { st.has(idx)?st.delete(idx):st.add(idx); c.classList.toggle("on"); }
        syncReveal(q,box);
      };
      wrap.appendChild(c);
    });
    box.appendChild(wrap);
    if(q.other){ const r=document.createElement("div"); r.className="reveal"; r.dataset.other=1;
      const inp=keepInput(q.k+" (autre)","input"); inp.type="text"; inp.placeholder=T[lang].other; r.appendChild(inp); box.appendChild(r); }
    if(q.reveal){ const r=document.createElement("div"); r.className="reveal"; r.dataset.rev=1;
      const inp=keepInput(q.reveal.k,"input"); inp.type="url"; inp.inputMode="url"; inp.dir="ltr"; inp.placeholder=T[lang].url; r.appendChild(inp); box.appendChild(r); }
    syncReveal(q,box);
  } else if(q.t==="social"){
    const list=document.createElement("div"); list.className="soc";
    if(!state[q.k]) state[q.k]=new Set();
    q.opts.forEach((op,idx)=>{
      const row=document.createElement("div"); row.className="row"+(state[q.k].has(idx)?" on":"");
      const c=document.createElement("button"); c.type="button"; c.className="chip"+(state[q.k].has(idx)?" on":""); c.textContent=L(op);
      const inp=keepInput(FR(op),"input"); inp.type="url"; inp.inputMode="url"; inp.dir="ltr"; inp.placeholder=T[lang].url;
      c.onclick=()=>{ const st=state[q.k]; st.has(idx)?st.delete(idx):st.add(idx); row.classList.toggle("on"); c.classList.toggle("on"); if(st.has(idx)) inp.focus(); };
      row.append(c,inp); list.appendChild(row);
    });
    box.appendChild(list);
  } else if(q.t==="file"){
    box.innerHTML = `<span class="ql">${L(q.l)}</span>`+hint;
    const lb=document.createElement("label"); lb.className="file";
    const inp=keepInput(q.k,"input",true); inp.type="file"; inp.name=q.k; inp.accept="image/*,.pdf,.ppt,.pptx,.doc,.docx,.ai,.eps,.svg";
    const nameSpan=document.createElement("span"); nameSpan.textContent=inp.files&&inp.files[0]?inp.files[0].name:T[lang].none;
    inp.onchange=()=>{ const f=inp.files[0]; if(f&&f.size>10*1024*1024){ alert(T[lang].tooBig); inp.value=""; } nameSpan.textContent=inp.files[0]?inp.files[0].name:T[lang].none; };
    const ic=document.createElement("div"); ic.className="ic"; ic.textContent="+";
    const txt=document.createElement("div"); txt.style.minWidth="0"; const b=document.createElement("b"); b.textContent=T[lang].choose; b.style.display="block";
    txt.append(b,nameSpan); lb.append(inp,ic,txt); box.appendChild(lb);
  }
  return box;
}

// keep typed values across language switches
const inputs = {};
function keepInput(k,tag,file){
  if(inputs[k]) return inputs[k];
  const el=document.createElement(tag); el.dataset.k=k; if(!file) el.dataset.field=1; inputs[k]=el; return el;
}
function syncReveal(q,box){
  const st=state[q.k]; if(!st) return;
  if(q.other){ const last=q.opts.length-1; box.querySelector("[data-other]").classList.toggle("on",st.has(last)); }
  if(q.reveal){ box.querySelector("[data-rev]").classList.toggle("on",q.reveal.when.some(i=>st.has(i))); }
}
function slug(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w]+/g,"-").toLowerCase();}

const back=document.getElementById("back"), nextBtn=document.getElementById("next-btn");
function nav(){
  back.textContent=T[lang].back; back.style.display=cur===0?"none":"";
  nextBtn.textContent = cur===0?T[lang].start:(cur===STEPS.length-1?T[lang].send:T[lang].next);
}
function show(i){
  cur=i; [...stepsEl.children].forEach((s,j)=>s.classList.toggle("on",j===i)); nav(); window.scrollTo({top:0,behavior:"smooth"});
}
function valid(){
  const sec=stepsEl.children[cur]; let ok=true;
  sec.querySelectorAll("[data-req]").forEach(el=>{ if(!el.value.trim()){ ok=false; el.style.borderColor="#FF8A8A"; } else el.style.borderColor=""; });
  const e=sec.querySelector("[data-err]"); if(e) e.classList.toggle("on",!ok);
  return ok;
}
back.onclick=()=>show(Math.max(0,cur-1));
nextBtn.onclick=()=>{ if(!valid()) return; if(cur<STEPS.length-1) show(cur+1); else submit(); };

function submit(){
  const h=document.getElementById("hidden"); h.innerHTML="";
  const add=(n,v)=>{ if(!v) return; const i=document.createElement("input"); i.type="hidden"; i.name=n; i.value=v; h.appendChild(i); };
  add("Langue du formulaire", lang==="fr"?"Français":"Hébreu");
  STEPS.forEach(s=>(s.q||[]).forEach(q=>{
    if(["text","tel","email","textarea"].includes(q.t)) add(q.k, inputs[q.k].value.trim());
    else if(q.t==="multi"||q.t==="single"){
      add(q.k,[...state[q.k]||[]].sort((a,b)=>a-b).map(i=>FR(q.opts[i])).join(", "));
      if(q.other && inputs[q.k+" (autre)"] && state[q.k].has(q.opts.length-1)) add(q.k+" (autre)", inputs[q.k+" (autre)"].value.trim());
      if(q.reveal && q.reveal.when.some(i=>state[q.k].has(i))) add(q.reveal.k, inputs[q.reveal.k].value.trim());
    } else if(q.t==="social"){
      [...state[q.k]].sort((a,b)=>a-b).forEach(i=>{ const n=FR(q.opts[i]); add(n, inputs[n].value.trim()||"Oui (lien non fourni)"); });
    }
  }));
  const name=inputs["Nom"].value.trim(), cab=inputs["Cabinet"].value.trim();
  document.getElementById("subj").value="Questionnaire site avocat : "+name+(cab?" ("+cab+")":"");
  document.getElementById("next").value=new URL("merci.html?l="+lang,location.href).href;
  // file inputs live in the DOM with their names; move them inside the form if needed
  nextBtn.disabled=true; nextBtn.textContent=T[lang].sending;
  document.getElementById("f").submit();
}

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
  lang=b.dataset.l; document.documentElement.lang=lang; document.documentElement.dir=lang==="he"?"rtl":"ltr";
  document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("on",x===b));
  document.title = lang==="he"?"Serial Kolors · שאלון לאתר":"Serial Kolors · Questionnaire site internet";
  build();
});
build();
</script>
